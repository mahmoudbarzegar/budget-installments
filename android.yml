name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Restore signing key
        env: { KS: "${{ secrets.DEBUG_KEYSTORE_B64 }}" }
        run: |
          test -n "$KS" || { echo "Missing secret DEBUG_KEYSTORE_B64"; exit 1; }
          mkdir -p ~/.android && echo "$KS" | base64 -d > ~/.android/debug.keystore
      - run: npm install
      - run: mkdir -p www && cp index.html manifest.json icon.svg www/
      - run: npx cap add android && npx cap sync android
      - run: cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: installments-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
